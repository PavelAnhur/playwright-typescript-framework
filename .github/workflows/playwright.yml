name: Playwright Tests - Maison AUT

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:


jobs:
  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout test framework
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - run: npm ci --legacy-peer-deps
    - run: npm run typecheck
    - run: npm run lint

    - name: Clone Maison
      run: |
        # Try different possible URLs
        if git clone https://github.com/PavelAnhur/maison.git maison; then
          echo "✅ Maison cloned successfully"
        else
          echo "❌ Failed to clone Maison"
          exit 1
        fi

    - name: Build Maison server
      run: |
        if [ -d "maison/server" ]; then
          cd maison/server
          npm ci
          npm run build
        else
          echo "❌ Maison not found in repository"
          exit 1
        fi

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Start app
      run: npm start &

    - name: Wait for app to be ready
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
            echo "App is up (attempt $i)"; exit 0
          fi
          echo "  attempt $i/30 — retrying in 1s"; sleep 1
        done
        echo "App never came up after 30s"; exit 1

    - name: Run UI tests
      run: npm run test:ui
