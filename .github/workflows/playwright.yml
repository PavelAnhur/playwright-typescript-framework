name: Playwright Tests - Maison AUT

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:


jobs:
  # Lint and typecheck job
  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 5
    steps:
    - name: Checkout test framework
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - run: npm ci --legacy-peer-deps
    - run: npm run typecheck
    - run: npm run lint

  # Unit tests job (runs in parallel with Playwright tests)
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
    - name: Checkout test framework
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - run: npm ci --legacy-peer-deps

    - name: Run Unit tests with coverage
      run: npm run test:unit:coverage

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-coverage
        path: coverage/
        retention-days: 10

  # Playwright E2E tests
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
    - name: Checkout test framework
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - run: npm ci --legacy-peer-deps

    - name: Clone Maison
      run: |
        if git clone https://github.com/PavelAnhur/maison.git maison; then
          echo "✅ Maison cloned successfully"
        else
          echo "❌ Failed to clone Maison"
          exit 1
        fi

    - name: Build Maison server
      run: |
        if [ -d "maison/server" ]; then
          cd maison/server
          npm ci
          npm run build
        else
          echo "❌ Maison not found in repository"
          exit 1
        fi

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Start app
      run: npm start &

    - name: Wait for app to be ready
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
            echo "App is up (attempt $i)"; exit 0
          fi
          echo "  attempt $i/30 — retrying in 1s"; sleep 1
        done
        echo "App never came up after 30s"; exit 1

    - name: Run UI tests
      run: npm run test:ui

    - name: Run API tests
      run: npm run test:api

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: |
          test-results/
          playwright-report/
        retention-days: 10
