name: Playwright Tests - Maison AUT

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - run: npm ci --legacy-peer-deps
    - run: npm run typecheck
    - run: npm run lint

  test-ui:
    needs: [ lint ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Start app
      run: npm start &
    - name: Wait for app to be ready
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
            echo "App is up (attempt $i)"; exit 0
          fi
          echo "  attempt $i/30 — retrying in 1s"; sleep 1
        done
        echo "App never came up after 30s"; exit 1
    - name: Run UI tests
      run: npm run test:ui
    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-ui
        path: playwright-report/
        retention-days: 10
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-ui
        path: test-results/
        retention-days: 10
        if-no-files-found: ignore
    - name: Stop app
      if: always()
      run: pkill -f "server/dist/index.js" || true

  test-mobile:
